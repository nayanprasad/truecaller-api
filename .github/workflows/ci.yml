name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Lint, Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: truecaller_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:migrate
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5432/truecaller_db
          
      - name: Seed database
        run: npm run seed
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5432/truecaller_db
          
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: PRODUCTION
          DATABASE_URL: postgresql://admin:password@localhost:5432/truecaller_db
          REDIS_URL: redis://localhost:6379
          REDIS_TTL: 3600
          REDIS_RATE_LIMIT_WINDOW: 60
          REDIS_RATE_LIMIT_MAX: 100
          SESSION_TTL: 2592000
